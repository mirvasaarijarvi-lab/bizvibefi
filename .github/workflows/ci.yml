name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # Nightly at 3:00 AM UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install ${{ github.actor == 'dependabot[bot]' && ' ' || '--frozen-lockfile' }}
      - run: bun run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install ${{ github.actor == 'dependabot[bot]' && ' ' || '--frozen-lockfile' }}
      - run: bunx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install ${{ github.actor == 'dependabot[bot]' && ' ' || '--frozen-lockfile' }}
      - run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install ${{ github.actor == 'dependabot[bot]' && ' ' || '--frozen-lockfile' }}
      - run: bun run build
