name: CI

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 03:00 UTC. Push and pull_request still run on every change;
    # a nightly cron was burning minutes on an unchanged main branch.
    - cron: '0 3 * * 1'
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Same ref only. Lint, typecheck, unit tests, and build do not mutate shared
# state, so cancelling a superseded run is safe.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install ${{ github.actor == 'dependabot[bot]' && ' ' || '--frozen-lockfile' }}
      - run: bun run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install ${{ github.actor == 'dependabot[bot]' && ' ' || '--frozen-lockfile' }}
      - run: bunx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install ${{ github.actor == 'dependabot[bot]' && ' ' || '--frozen-lockfile' }}
      - run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install ${{ github.actor == 'dependabot[bot]' && ' ' || '--frozen-lockfile' }}
      - run: bun run build
