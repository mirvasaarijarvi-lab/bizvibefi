name: Security

on:
  workflow_dispatch:
  schedule:
    # Weekly scan, Monday 05:00 UTC (07:00 Europe/Helsinki summer / 08:00 winter)
    - cron: "0 5 * * 1"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lockb"
      - "package-lock.json"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lockb"
      - "package-lock.json"

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (no scripts)
        run: npm ci --ignore-scripts

      - name: Run npm audit
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # CodeQL
  # ---------------------------------------------------------------------------
  # Runs via GitHub's "default setup" (Settings → Code security & analysis →
  # Code scanning → CodeQL → Default). Adding an advanced job here would
  # conflict with default setup, so severity thresholds are configured in the
  # UI, not in this file:
  #
  #   Settings → Code security & analysis → Code scanning →
  #     "Protection rules" → "Alerts that fail check runs"
  #       Severity: Error (or High and above) — fail PRs only on actionable
  #       Security severity: High and above
  #
  # That keeps Note/Warning-level CodeQL findings visible in the Security tab
  # without blocking merges on noisy/style-level alerts.
  # ---------------------------------------------------------------------------

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gitleaks has no severity scale — every match fails. False-positive
      # reduction lives in `.gitleaks.toml` via allowlists for publishable
      # identifiers, test fixtures, and placeholder values. The action below
      # fails the job only when a non-allowlisted secret is detected.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"


  lovable-platform-findings:
    name: Lovable platform findings (connector + agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The Lovable Security panel can export the full scan as JSON. CI expects
      # the latest export at `.security/lovable-report.json` — committed by the
      # release author, or dropped in by a preceding job that fetches it. The
      # baseline at `.security/lovable-baseline.json` captures findings that
      # have been triaged (fixed or `ignore`d with rationale in @security-memory).
      # Missing report on a PR / regular push = warn and skip. The release
      # workflow (rc-smoke.yml) is the hard gate that fails when the export
      # is absent before a release.
      - name: Ensure report exists
        id: report
        run: |
          if [ ! -s .security/lovable-report.json ]; then
            echo "::warning::No .security/lovable-report.json in tree — skipping Lovable platform diff. Export from the Security panel and commit before a release."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Diff against baseline (fail on new findings)
        if: steps.report.outputs.present == 'true'
        run: node scripts/security/check-lovable-findings.cjs


      - name: Upload full report + baseline
        if: always() && steps.report.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lovable-security-report
          path: |
            .security/lovable-report.json
            .security/lovable-baseline.json
          retention-days: 30
          if-no-files-found: warn

  summary:
    name: Security summary
    needs: [npm-audit, gitleaks, supabase-db-lint, lovable-platform-findings]

    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Collect tool versions
        id: versions
        run: |
          NODE_V=$(node -v 2>/dev/null || echo "n/a")
          NPM_V=$(npm -v 2>/dev/null || echo "n/a")
          GITLEAKS_V="action: gitleaks/gitleaks-action@v2"
          echo "node=$NODE_V"     >> "$GITHUB_OUTPUT"
          echo "npm=$NPM_V"       >> "$GITHUB_OUTPUT"
          echo "gitleaks=$GITLEAKS_V" >> "$GITHUB_OUTPUT"

      - name: Download db lint artifacts
        if: needs.supabase-db-lint.result == 'failure'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          # Matrix produces one artifact per pg_major; merge them all under
          # dblint-artifact/ for the summary tail step.
          pattern: supabase-db-lint-pg*
          path: dblint-artifact
          merge-multiple: true

      - name: Build markdown summary
        id: md
        env:
          AUDIT_RESULT:    ${{ needs.npm-audit.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          DBLINT_RESULT:   ${{ needs.supabase-db-lint.result }}
          LOVABLE_RESULT:  ${{ needs.lovable-platform-findings.result }}
          NODE_V:          ${{ steps.versions.outputs.node }}
          NPM_V:           ${{ steps.versions.outputs.npm }}
          GITLEAKS_V:      ${{ steps.versions.outputs.gitleaks }}
          REPO:            ${{ github.repository }}
          RUN_ID:          ${{ github.run_id }}
          SHA:             ${{ github.sha }}
          SERVER:          ${{ github.server_url }}
        run: |
          icon() { case "$1" in
            success) echo ":white_check_mark: pass" ;;
            failure) echo ":x: fail" ;;
            skipped) echo ":fast_forward: skipped" ;;
            cancelled) echo ":no_entry: cancelled" ;;
            *) echo ":grey_question: $1" ;;
          esac; }

          AUDIT_ICON=$(icon "$AUDIT_RESULT")
          GITLEAKS_ICON=$(icon "$GITLEAKS_RESULT")
          DBLINT_ICON=$(icon "$DBLINT_RESULT")
          LOVABLE_ICON=$(icon "$LOVABLE_RESULT")

          RUN_URL="$SERVER/$REPO/actions/runs/$RUN_ID"
          ARTIFACTS_URL="$RUN_URL#artifacts"
          ALERTS_URL="$SERVER/$REPO/security/code-scanning"
          SECRETS_URL="$SERVER/$REPO/security/secret-scanning"
          DEPS_URL="$SERVER/$REPO/security/dependabot"

          {
            echo "## Security status"
            echo ""
            echo "Commit: \`${SHA:0:7}\` — [run log]($RUN_URL)"
            echo ""
            echo "| Check | Tool / version | Severity gate | Result |"
            echo "| --- | --- | --- | --- |"
            echo "| npm audit | npm $NPM_V (node $NODE_V) | high+ | $AUDIT_ICON |"
            echo "| Secret scan | $GITLEAKS_V | any non-allowlisted match | $GITLEAKS_ICON |"
            echo "| Supabase db lint | supabase/setup-cli@v1 (pinned) | error | $DBLINT_ICON |"
            echo "| CodeQL | GitHub default setup | Error / Security: High+ | see [Code scanning alerts]($ALERTS_URL) |"
            echo "| Lovable platform scans | connector_security_scan + agent_security (diff vs baseline) | any new finding | $LOVABLE_ICON |"
            echo ""

            if [ "$DBLINT_RESULT" = "failure" ]; then
              echo "### :x: supabase db lint output"
              echo ""
              echo "Full artifact: [\`supabase-db-lint\`]($ARTIFACTS_URL) (lint.json + lint.txt, 14-day retention)."
              echo ""
              SRC=""
              if [ -s dblint-artifact/lint.txt ]; then SRC=dblint-artifact/lint.txt
              elif [ -s dblint-artifact/lint.json ]; then SRC=dblint-artifact/lint.json
              fi
              if [ -n "$SRC" ]; then
                TOTAL=$(wc -l < "$SRC")
                echo "<details><summary>Last 80 lines of \`$(basename "$SRC")\` ($TOTAL lines total)</summary>"
                echo ""
                echo '```'
                tail -n 80 "$SRC"
                echo '```'
                echo ""
                echo "</details>"
              else
                echo "_Artifact unavailable — open the run log for full output._"
              fi
              echo ""
            fi

            echo "**Result links**"
            echo "- [Code scanning alerts]($ALERTS_URL)"
            echo "- [Secret scanning alerts]($SECRETS_URL)"
            echo "- [Dependabot alerts]($DEPS_URL)"
            echo "- [Workflow artifacts]($ARTIFACTS_URL)"
            echo "- Lovable platform scans: open the project in Lovable → Security panel"
          } | tee "$GITHUB_STEP_SUMMARY" > summary.md


          {
            echo "body<<__EOF__"
            cat summary.md
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: security-status
          message: ${{ steps.md.outputs.body }}

  supabase-db-lint:
    # Matrixed across Postgres major versions supported by the Supabase CLI
    # so a guest-access RLS regression specific to one PG release (e.g. a
    # planner change that lets a SECURITY DEFINER body see a row it
    # shouldn't, or a new system role grant) is caught before merge.
    # `fail-fast: false` keeps every cell running even if one fails — a
    # PG17-only break shouldn't hide a still-present PG15 break.
    name: Supabase db lint + RLS (pg${{ matrix.pg_major }})
    # Heavy job (boots local Supabase stack) — only run on PRs and manual dispatch.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supabase CLI 1.226.4 ships images for these two majors. Add 16
        # here once Supabase publishes an image for it; the rest of the
        # job is version-agnostic.
        pg_major: [15, 17]
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin to avoid transient "Gateway Time-out" from the latest-release resolver.
          version: 1.226.4

      # ----- Pin Postgres major version for this matrix cell -----
      # Supabase CLI reads `[db].major_version` from config.toml. The
      # checked-in config does not set it (defaults to 15), so we inject
      # it per-cell. Idempotent: replaces any existing value.
      - name: Pin config.toml to pg${{ matrix.pg_major }}
        run: |
          if grep -qE '^\[db\]' supabase/config.toml; then
            if grep -qE '^\s*major_version\s*=' supabase/config.toml; then
              sed -i -E 's/^\s*major_version\s*=.*/major_version = ${{ matrix.pg_major }}/' supabase/config.toml
            else
              awk '1; /^\[db\]/ && !done { print "major_version = ${{ matrix.pg_major }}"; done=1 }' \
                supabase/config.toml > supabase/config.toml.new
              mv supabase/config.toml.new supabase/config.toml
            fi
          else
            printf '\n[db]\nmajor_version = %s\n' "${{ matrix.pg_major }}" >> supabase/config.toml
          fi
          echo "----- config.toml after pin -----"
          grep -A2 -E '^\[db\]' supabase/config.toml || true

      # ----- Cache Docker images for the local Supabase stack -----
      # `supabase start` pulls ~1 GB of images (postgres, kong, gotrue,
      # postgrest, realtime, storage). Caching the saved tarball cuts the
      # boot step from ~3 min to ~30 s on warm runs. Key on CLI version +
      # pg-major + config.toml so a major-version flip rebuilds the cache.
      - name: Restore Supabase Docker image cache
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/supabase-docker-images.tar
          key: supabase-docker-${{ runner.os }}-cli-1.226.4-pg${{ matrix.pg_major }}-${{ hashFiles('supabase/config.toml') }}
          restore-keys: |
            supabase-docker-${{ runner.os }}-cli-1.226.4-pg${{ matrix.pg_major }}-

      - name: Load cached Docker images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          if [ -f ~/.cache/supabase-docker-images.tar ]; then
            echo "Loading cached Supabase images..."
            docker load -i ~/.cache/supabase-docker-images.tar
            docker images | grep -E 'supabase|postgres' || true
          fi

      # Cache the CLI's own state dir (migration history, generated keys).
      - name: Cache Supabase CLI state
        uses: actions/cache@v4
        with:
          path: |
            ~/.supabase
            supabase/.temp
          key: supabase-cli-state-${{ runner.os }}-pg${{ matrix.pg_major }}-${{ hashFiles('supabase/config.toml', 'supabase/migrations/**/*.sql') }}
          restore-keys: |
            supabase-cli-state-${{ runner.os }}-pg${{ matrix.pg_major }}-

      - name: Start local Supabase stack
        run: supabase start -x studio,inbucket,imgproxy,edge-runtime,logflare,vector,pgadmin-schema-diff,migra

      - name: Save Docker images to cache
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache
          IMAGES=$(docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -Ei 'supabase|postgres|kong|gotrue|postgrest|realtime|storage' \
            | grep -v '<none>' || true)
          if [ -n "$IMAGES" ]; then
            echo "Saving images:"; echo "$IMAGES"
            docker save $IMAGES -o ~/.cache/supabase-docker-images.tar
            ls -lh ~/.cache/supabase-docker-images.tar
          else
            echo "No Supabase images found to cache."
          fi


      # ----- Validate migrations + seed apply cleanly from scratch -----
      # `supabase db reset` drops the local DB, replays every migration in
      # supabase/migrations in order, then auto-runs supabase/seed.sql (if
      # present). With `set -o pipefail` + `tee`, any non-zero exit from the
      # CLI (failed migration, broken seed, missing GRANT, type mismatch)
      # propagates out of the pipeline and fails the PR.
      - name: Validate migrations + seed (supabase db reset)
        id: dbreset
        run: |
          set -o pipefail
          if ! supabase db reset --linked=false 2>&1 | tee db-reset.txt; then
            echo "::error title=supabase db reset failed::Migrations or seed.sql raised a SQL error during reset. See db-reset.txt artifact and the log above."
            exit 1
          fi

      # ----- Run any extra seed scripts under supabase/seeds/ -----
      # `supabase db reset` only runs the single supabase/seed.sql file.
      # If the project keeps additional ordered seed scripts in
      # supabase/seeds/*.sql, replay them through psql with ON_ERROR_STOP=1
      # so the first SQL error aborts and fails the PR.
      - name: Run extra seed scripts (fail-fast on SQL error)
        if: hashFiles('supabase/seeds/*.sql') != ''
        run: |
          set -o pipefail
          DB_URL=$(supabase status -o env 2>/dev/null | awk -F= '/^DB_URL=/{gsub(/"/,"",$2); print $2}')
          if [ -z "$DB_URL" ]; then
            echo "::error::Could not resolve local DB_URL from 'supabase status'."
            exit 1
          fi
          : > seed-run.txt
          for f in $(ls supabase/seeds/*.sql | sort); do
            echo "==> Applying $f" | tee -a seed-run.txt
            if ! psql "$DB_URL" \
                  --set ON_ERROR_STOP=1 \
                  --single-transaction \
                  -v VERBOSITY=verbose \
                  -f "$f" 2>&1 | tee -a seed-run.txt; then
              echo "::error file=${f},title=Seed script failed::SQL error while applying ${f}. See seed-run.txt artifact."
              exit 1
            fi
          done



      # ----- Detect schema drift after reset -----
      # After a clean `supabase db reset`, the local DB == the committed
      # migration history by construction. `supabase db diff` then prints any
      # delta between that live schema and the migrations. A non-empty diff
      # means someone changed the DB without committing a matching migration
      # (or a migration is incomplete) — fail the PR so the drift is caught
      # in review.
      - name: Check for schema drift (supabase db diff)
        id: dbdiff
        run: |
          set -o pipefail
          # Diff app-owned schemas only. Skip Supabase-managed schemas
          # (auth, storage, realtime, supabase_functions, vault, pgmq) which
          # we never own and which change between CLI releases.
          supabase db diff \
            --schema public \
            --linked=false 2>&1 | tee db-diff.txt

          # The CLI exits 0 even when a diff exists, so we have to inspect
          # the output. Strip ANSI colour codes, blank lines, and the
          # "No schema changes found" banner before checking for content.
          BODY=$(sed -r 's/\x1B\[[0-9;]*[A-Za-z]//g' db-diff.txt \
                 | grep -vE '^\s*$|No schema changes found' || true)

          if [ -z "$BODY" ]; then
            echo "No schema drift detected."
            exit 0
          fi

          # Save the diff as a candidate migration so the artifact contains
          # a ready-to-commit `.sql` file the author can drop into
          # supabase/migrations/ after review.
          TS=$(date -u +%Y%m%d%H%M%S)
          CANDIDATE="suggested_${TS}_capture_drift.sql"
          {
            echo "-- Auto-generated from 'supabase db diff' on $(date -u +%FT%TZ)"
            echo "-- Review carefully before committing to supabase/migrations/."
            echo
            sed -r 's/\x1B\[[0-9;]*[A-Za-z]//g' db-diff.txt
          } > "$CANDIDATE"

          # Inline preview (first 60 lines) for the PR run log.
          {
            echo "::error title=Schema drift detected::Local DB differs from migrations. A candidate migration was uploaded as ${CANDIDATE} in the supabase-db-reset-diff artifact."
            echo "::group::supabase db diff (first 60 lines)"
            head -n 60 "$CANDIDATE"
            echo "::endgroup::"
          }
          exit 1

      - name: Upload db reset/diff output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-db-reset-diff-pg${{ matrix.pg_major }}
          path: |
            db-reset.txt
            db-diff.txt
            seed-run.txt
            suggested_*_capture_drift.sql
          retention-days: 14
          if-no-files-found: ignore


      # ----- RLS regression tests for sensitive tables -----
      # Replays supabase/tests/rls/*.sql against the freshly-reset DB through
      # psql with ON_ERROR_STOP=1. Each test file uses DO blocks that RAISE
      # on the unexpected outcome, so a regression (e.g. a new permissive
      # SELECT policy on event_signups, or accidental EXECUTE to anon on an
      # admin RPC) aborts the run and fails the PR.
      - name: Run RLS regression tests
        id: rlstests
        if: hashFiles('supabase/tests/rls/*.sql') != ''
        run: |
          set +e   # capture per-file failures so we can finish the report
          DB_URL=$(supabase status -o env 2>/dev/null | awk -F= '/^DB_URL=/{gsub(/"/,"",$2); print $2}')
          if [ -z "$DB_URL" ]; then
            echo "::error::Could not resolve local DB_URL from 'supabase status'."
            exit 1
          fi
          : > rls-tests.txt
          FAILED_FILES=()
          for f in $(ls supabase/tests/rls/*.sql | sort); do
            base=$(basename "$f")
            # Files starting with "_" are includes (e.g. _helpers.sql), not tests.
            # Skip includes (_helpers.sql) and the parameterized role probe
            # (role_probe.sql) — the probe is invoked separately by the
            # connection-role matrix step with `-v role=...`.
            case "$base" in _*|role_probe.sql) echo "==> Skipping $f" | tee -a rls-tests.txt; continue ;; esac
            echo "==> Running $f" | tee -a rls-tests.txt
            (cd "$(dirname "$f")" && psql "$DB_URL" \
                  --set ON_ERROR_STOP=1 \
                  -v VERBOSITY=verbose \
                  -f "$base") >> rls-tests.txt 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "==> FAILED $f (exit $rc)" | tee -a rls-tests.txt
              FAILED_FILES+=("$f")
              echo "::error file=${f},title=RLS regression failed::See rls-tests.txt and rls-report.md artifacts."
            fi
          done

          # ----- Build markdown report from RLS-ASSERT|... tagged NOTICEs -----
          # Lines look like:  NOTICE:  RLS-ASSERT|PASS|expect_denied|<msg>|<detail>
          {
            echo "# RLS regression report"
            echo
            echo "Commit: \`${GITHUB_SHA:0:7}\` — run: $GITHUB_RUN_ID"
            echo
          } > rls-report.md

          CURRENT_FILE=""
          TOTAL=0; PASS=0; FAIL=0

          # Per-file tables
          while IFS= read -r line; do
            if [[ "$line" =~ ^==\>\ Running\ (.+)$ ]]; then
              CURRENT_FILE="${BASH_REMATCH[1]}"
              echo ""                                 >> rls-report.md
              echo "## \`$CURRENT_FILE\`"             >> rls-report.md
              echo ""                                 >> rls-report.md
              echo "| Status | Kind | Assertion | Detail |" >> rls-report.md
              echo "| --- | --- | --- | --- |"        >> rls-report.md
              continue
            fi
            # Strip leading "NOTICE:  " (psql VERBOSITY=verbose may add CONTEXT lines)
            stripped="${line#*RLS-ASSERT|}"
            if [ "$stripped" != "$line" ]; then
              IFS='|' read -r status kind msg detail <<< "$stripped"
              TOTAL=$((TOTAL+1))
              case "$status" in
                PASS) PASS=$((PASS+1)); icon=":white_check_mark:" ;;
                FAIL) FAIL=$((FAIL+1)); icon=":x:" ;;
                *)    icon=":grey_question:" ;;
              esac
              # Escape pipes in user content so the table doesn't break.
              msg_esc="${msg//|/\\|}"
              detail_esc="${detail//|/\\|}"
              echo "| $icon $status | $kind | $msg_esc | ${detail_esc:--} |" >> rls-report.md
            fi
          done < rls-tests.txt

          # ----- Build fixture snapshot report -----
          # Lines look like:
          #   NOTICE:  RLS-FIXTURE|<label>|<row_json>
          #   NOTICE:  RLS-FIXTURE-COUNT|<label>|<n>
          # Grouped per test file so a "count off by one" failure shows the
          # exact rows that were seeded for that file's transaction.
          {
            echo "# RLS fixture snapshot"
            echo
            echo "Commit: \`${GITHUB_SHA:0:7}\` — run: $GITHUB_RUN_ID"
            echo
            echo "One entry per \`snapshot()\` / \`snapshot_fixtures()\` call, captured as table owner (RLS bypassed) so it reflects ground truth."
          } > rls-fixtures.md

          CURRENT_FILE=""
          FX_TOTAL_ROWS=0
          FX_GROUPS=0
          while IFS= read -r line; do
            if [[ "$line" =~ ^==\>\ Running\ (.+)$ ]]; then
              CURRENT_FILE="${BASH_REMATCH[1]}"
              echo ""                                  >> rls-fixtures.md
              echo "## \`$CURRENT_FILE\`"              >> rls-fixtures.md
              continue
            fi
            stripped="${line#*RLS-FIXTURE-COUNT|}"
            if [ "$stripped" != "$line" ]; then
              IFS='|' read -r label n <<< "$stripped"
              echo ""                                  >> rls-fixtures.md
              echo "_\`$label\`: $n row(s)_"           >> rls-fixtures.md
              FX_GROUPS=$((FX_GROUPS+1))
              FX_TOTAL_ROWS=$((FX_TOTAL_ROWS + n))
              continue
            fi
            stripped="${line#*RLS-FIXTURE|}"
            if [ "$stripped" != "$line" ]; then
              IFS='|' read -r label payload <<< "$stripped"
              # Render each row as a fenced JSON block under its label.
              echo ""                                  >> rls-fixtures.md
              echo "**$label**"                        >> rls-fixtures.md
              echo '```json'                           >> rls-fixtures.md
              echo "$payload"                          >> rls-fixtures.md
              echo '```'                               >> rls-fixtures.md
            fi
          done < rls-tests.txt

          {
            echo ""
            echo "## Snapshot summary"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Snapshot groups | $FX_GROUPS |"
            echo "| Total rows captured | $FX_TOTAL_ROWS |"
          } >> rls-fixtures.md


          # Top-level summary
          {
            echo ""
            echo "## Summary"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Assertions total | $TOTAL |"
            echo "| Passed | $PASS |"
            echo "| Failed | $FAIL |"
            echo "| Files with errors | ${#FAILED_FILES[@]} |"
            if [ ${#FAILED_FILES[@]} -gt 0 ]; then
              echo ""
              echo "### Failed files"
              for ff in "${FAILED_FILES[@]}"; do echo "- \`$ff\`"; done
            fi
          } >> rls-report.md

          # Mirror into the GitHub Actions step summary for easy inline viewing.
          cat rls-report.md   >> "$GITHUB_STEP_SUMMARY"
          echo ""             >> "$GITHUB_STEP_SUMMARY"
          cat rls-fixtures.md >> "$GITHUB_STEP_SUMMARY"

          echo "total=$TOTAL"   >> "$GITHUB_OUTPUT"
          echo "passed=$PASS"   >> "$GITHUB_OUTPUT"
          echo "failed=$FAIL"   >> "$GITHUB_OUTPUT"

          # Exit non-zero if any file failed so the PR check fails.
          if [ ${#FAILED_FILES[@]} -gt 0 ] || [ "$FAIL" -gt 0 ]; then
            exit 1
          fi

      - name: Upload RLS test output artifact
        if: always() && hashFiles('rls-tests.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: supabase-rls-tests-pg${{ matrix.pg_major }}
          path: |
            rls-tests.txt
            rls-report.md
            rls-fixtures.md
            rls-role-matrix.md
          retention-days: 14
          if-no-files-found: ignore

      # ----- Connection-role matrix smoke -----
      # The RLS tests above switch roles internally via SET LOCAL ROLE under
      # a postgres-owned connection. This step re-runs the guest-facing
      # surface (public RPCs + write attempts on PII tables) under real
      # connection roles — anon, authenticated, service_role — so we catch
      # GRANT-level regressions (e.g. someone accidentally revoking EXECUTE
      # from anon on get_event_rsvp_count, or widening write privileges).
      #
      # Per-role expected behaviour:
      #   anon, authenticated  → public RPCs OK, direct writes raise 42501
      #   service_role         → public RPCs OK, direct writes also OK
      #                          (service_role bypasses RLS by design)
      - name: RLS smoke per connection role
        if: hashFiles('supabase/tests/rls/*.sql') != ''
        run: |
          set +e
          DB_URL=$(supabase status -o env 2>/dev/null | awk -F= '/^DB_URL=/{gsub(/"/,"",$2); print $2}')
          if [ -z "$DB_URL" ]; then
            echo "::error::Could not resolve local DB_URL from 'supabase status'."
            exit 1
          fi

          {
            echo "# RLS connection-role matrix (pg${{ matrix.pg_major }})"
            echo
            echo "Commit: \`${GITHUB_SHA:0:7}\` — run: $GITHUB_RUN_ID"
            echo
            echo "| Role | Public RPC (leaderboard) | Public RPC (RSVP count) | Direct write (event_signups) | Expected | Result |"
            echo "| --- | --- | --- | --- | --- | --- |"
          } > rls-role-matrix.md

          FAILED=0
          # event_signups guest INSERT path is intentionally open to anon,
          # so we probe member_badges instead — that one MUST be denied for
          # anon/authenticated and MUST succeed for service_role.
          for ROLE in anon authenticated service_role; do
            case "$ROLE" in
              anon|authenticated) EXPECT_WRITE_SQLSTATE="42501"; EXPECT_LABEL="RPCs ok, write 42501" ;;
              service_role)        EXPECT_WRITE_SQLSTATE="00000"; EXPECT_LABEL="RPCs ok, write ok" ;;
            esac

            OUT=$(psql "$DB_URL" --set ON_ERROR_STOP=0 -v "role=$ROLE" \
                  -f supabase/tests/rls/role_probe.sql 2>&1)
            echo "----- role=$ROLE -----"
            echo "$OUT"

            RPC_LB=$(echo "$OUT" | grep -Eo 'rpc_leaderboard_ok=(t|true)' | head -1)
            RPC_RC=$(echo "$OUT" | grep -Eo 'rpc_rsvp_count_ok=(t|true)' | head -1)
            WRITE_STATE=$(echo "$OUT" | grep -Eo 'write_sqlstate=[0-9A-Z]+' | tail -1 | cut -d= -f2)
            WRITE_STATE=${WRITE_STATE:-unknown}

            STATUS=":white_check_mark: pass"
            if [ -z "$RPC_LB" ] || [ -z "$RPC_RC" ] || [ "$WRITE_STATE" != "$EXPECT_WRITE_SQLSTATE" ]; then
              STATUS=":x: fail"
              FAILED=$((FAILED+1))
              echo "::error title=RLS role matrix failed (pg${{ matrix.pg_major }} / $ROLE)::leaderboard=${RPC_LB:-MISSING}, rsvp=${RPC_RC:-MISSING}, write=$WRITE_STATE (expected $EXPECT_WRITE_SQLSTATE)"
            fi

            echo "| \`$ROLE\` | ${RPC_LB:-MISSING} | ${RPC_RC:-MISSING} | \`$WRITE_STATE\` | $EXPECT_LABEL | $STATUS |" >> rls-role-matrix.md
          done

          echo "" >> rls-role-matrix.md
          echo "_Failures: $FAILED_" >> rls-role-matrix.md
          cat rls-role-matrix.md >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILED" -gt 0 ]; then exit 1; fi






      - name: Run db lint (JSON, fail on error-level)
        id: dblint
        run: |
          set -o pipefail
          # JSON output so we can emit precise GitHub annotations per finding.
          supabase db lint --level error --linked=false --output json | tee lint.json
          # Human-readable form captured to a file for the summary/artifact.
          supabase db lint --level error --linked=false 2>&1 | tee lint.txt || true

      - name: Upload db lint output artifact
        if: always() && hashFiles('lint.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: supabase-db-lint-pg${{ matrix.pg_major }}
          path: |
            lint.json
            lint.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Annotate findings
        if: always() && hashFiles('lint.json') != ''
        run: |
          # supabase db lint JSON shape (per schema):
          # [ { "level": "...",
          #     "lints": [ { "name", "level", "message", "detail", "function",
          #                   "statement_position", "cache_key" }, ... ] }, ... ]
          # Annotations need a file path. lint findings reference database
          # objects, not files, so we best-effort map an object name back to
          # the migration that last defines it via grep.
          if ! command -v jq >/dev/null; then sudo apt-get update -y && sudo apt-get install -y jq; fi

          ERRORS=0
          # Flatten: one line per finding => "level<TAB>name<TAB>function<TAB>message"
          jq -r '
            (if type=="array" then . else [.] end)
            | map(.lints // [])
            | add // []
            | .[]
            | [ (.level // "error"),
                (.name // ""),
                (.function // .relation // .object // ""),
                ((.message // "") + (if .detail then " — " + .detail else "" end))
              ] | @tsv
          ' lint.json > findings.tsv || true

          while IFS=$'\t' read -r level name fn msg; do
            [ -z "$level" ] && continue
            # Map gh annotation level
            case "$level" in
              error)   gh_lvl="error" ;;
              warning) gh_lvl="warning" ;;
              *)       gh_lvl="notice" ;;
            esac

            file=""; line=""
            if [ -n "$fn" ]; then
              # Find the migration that mentions this object (function / table / policy).
              match=$(grep -RInE "\b${fn}\b" supabase/migrations 2>/dev/null | head -n1 || true)
              if [ -n "$match" ]; then
                file=$(echo "$match" | cut -d: -f1)
                line=$(echo "$match" | cut -d: -f2)
              fi
            fi

            title="supabase db lint: ${name:-finding}${fn:+ ($fn)}"
            esc_msg=$(printf '%s' "$msg" | tr '\n' ' ' | sed 's/::/:\\:/g')

            if [ -n "$file" ] && [ -n "$line" ]; then
              echo "::${gh_lvl} file=${file},line=${line},title=${title}::${esc_msg}"
            else
              echo "::${gh_lvl} title=${title}::${esc_msg}"
            fi

            if [ "$level" = "error" ]; then ERRORS=$((ERRORS+1)); fi
          done < findings.tsv

          echo "error_count=$ERRORS" >> "$GITHUB_OUTPUT"
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::supabase db lint reported $ERRORS error-level finding(s)"
            exit 1
          fi


      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup || true
