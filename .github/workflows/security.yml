name: Security

on:
  workflow_dispatch:
  schedule:
    # Weekly scan, Monday 05:00 UTC (07:00 Europe/Helsinki summer / 08:00 winter)
    - cron: "0 5 * * 1"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lockb"
      - "package-lock.json"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lockb"
      - "package-lock.json"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (no scripts)
        run: npm ci --ignore-scripts

      - name: Run npm audit
        run: npm audit --audit-level=high

  # CodeQL runs via GitHub's "default setup" (Settings → Code security).
  # No workflow job needed; an advanced job here would conflict with default setup.



  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
