name: Security

on:
  workflow_dispatch:
  schedule:
    # Weekly scan, Monday 05:00 UTC (07:00 Europe/Helsinki summer / 08:00 winter)
    - cron: "0 5 * * 1"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lockb"
      - "package-lock.json"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lockb"
      - "package-lock.json"

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (no scripts)
        run: npm ci --ignore-scripts

      - name: Run npm audit
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # CodeQL
  # ---------------------------------------------------------------------------
  # Runs via GitHub's "default setup" (Settings → Code security & analysis →
  # Code scanning → CodeQL → Default). Adding an advanced job here would
  # conflict with default setup, so severity thresholds are configured in the
  # UI, not in this file:
  #
  #   Settings → Code security & analysis → Code scanning →
  #     "Protection rules" → "Alerts that fail check runs"
  #       Severity: Error (or High and above) — fail PRs only on actionable
  #       Security severity: High and above
  #
  # That keeps Note/Warning-level CodeQL findings visible in the Security tab
  # without blocking merges on noisy/style-level alerts.
  # ---------------------------------------------------------------------------

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gitleaks has no severity scale — every match fails. False-positive
      # reduction lives in `.gitleaks.toml` via allowlists for publishable
      # identifiers, test fixtures, and placeholder values. The action below
      # fails the job only when a non-allowlisted secret is detected.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"


  summary:
    name: Security summary
    needs: [npm-audit, gitleaks, supabase-db-lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Collect tool versions
        id: versions
        run: |
          NODE_V=$(node -v 2>/dev/null || echo "n/a")
          NPM_V=$(npm -v 2>/dev/null || echo "n/a")
          GITLEAKS_V="action: gitleaks/gitleaks-action@v2"
          echo "node=$NODE_V"     >> "$GITHUB_OUTPUT"
          echo "npm=$NPM_V"       >> "$GITHUB_OUTPUT"
          echo "gitleaks=$GITLEAKS_V" >> "$GITHUB_OUTPUT"

      - name: Build markdown summary
        id: md
        env:
          AUDIT_RESULT:    ${{ needs.npm-audit.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          DBLINT_RESULT:   ${{ needs.supabase-db-lint.result }}
          NODE_V:          ${{ steps.versions.outputs.node }}
          NPM_V:           ${{ steps.versions.outputs.npm }}
          GITLEAKS_V:      ${{ steps.versions.outputs.gitleaks }}
          REPO:            ${{ github.repository }}
          RUN_ID:          ${{ github.run_id }}
          SHA:             ${{ github.sha }}
          SERVER:          ${{ github.server_url }}
        run: |
          icon() { case "$1" in
            success) echo ":white_check_mark: pass" ;;
            failure) echo ":x: fail" ;;
            skipped) echo ":fast_forward: skipped" ;;
            cancelled) echo ":no_entry: cancelled" ;;
            *) echo ":grey_question: $1" ;;
          esac; }

          AUDIT_ICON=$(icon "$AUDIT_RESULT")
          GITLEAKS_ICON=$(icon "$GITLEAKS_RESULT")
          DBLINT_ICON=$(icon "$DBLINT_RESULT")
          RUN_URL="$SERVER/$REPO/actions/runs/$RUN_ID"
          ALERTS_URL="$SERVER/$REPO/security/code-scanning"
          SECRETS_URL="$SERVER/$REPO/security/secret-scanning"
          DEPS_URL="$SERVER/$REPO/security/dependabot"

          {
            echo "## Security status"
            echo ""
            echo "Commit: \`${SHA:0:7}\` — [run log]($RUN_URL)"
            echo ""
            echo "| Check | Tool / version | Severity gate | Result |"
            echo "| --- | --- | --- | --- |"
            echo "| npm audit | npm $NPM_V (node $NODE_V) | high+ | $AUDIT_ICON |"
            echo "| Secret scan | $GITLEAKS_V | any non-allowlisted match | $GITLEAKS_ICON |"
            echo "| Supabase db lint | supabase/setup-cli@v1 (latest) | error | $DBLINT_ICON |"
            echo "| CodeQL | GitHub default setup | Error / Security: High+ | see [Code scanning alerts]($ALERTS_URL) |"
            echo "| Lovable platform scans | agent_security, supabase_lov, Wiz (connector_security_scan) | actionable only | see project Security panel |"
            echo ""
            echo "**Result links**"
            echo "- [Code scanning alerts]($ALERTS_URL)"
            echo "- [Secret scanning alerts]($SECRETS_URL)"
            echo "- [Dependabot alerts]($DEPS_URL)"
            echo "- Lovable platform scans: open the project in Lovable → Security panel"
          } | tee "$GITHUB_STEP_SUMMARY" > summary.md

          {
            echo "body<<__EOF__"
            cat summary.md
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: security-status
          message: ${{ steps.md.outputs.body }}

  supabase-db-lint:
    name: Supabase db lint (error)
    # Heavy job (boots local Supabase stack) — only run on PRs and manual dispatch.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin to avoid transient "Gateway Time-out" from the latest-release resolver.
          version: 1.226.4

      # ----- Cache Docker images for the local Supabase stack -----
      # `supabase start` pulls ~1 GB of images (postgres, kong, gotrue,
      # postgrest, realtime, storage). Caching the saved tarball cuts the
      # boot step from ~3 min to ~30 s on warm runs. Key on CLI version +
      # config.toml so an image set is invalidated when either changes.
      - name: Restore Supabase Docker image cache
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/supabase-docker-images.tar
          key: supabase-docker-${{ runner.os }}-cli-1.226.4-${{ hashFiles('supabase/config.toml') }}
          restore-keys: |
            supabase-docker-${{ runner.os }}-cli-1.226.4-

      - name: Load cached Docker images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          if [ -f ~/.cache/supabase-docker-images.tar ]; then
            echo "Loading cached Supabase images..."
            docker load -i ~/.cache/supabase-docker-images.tar
            docker images | grep -E 'supabase|postgres' || true
          fi

      # Cache the CLI's own state dir (migration history, generated keys).
      - name: Cache Supabase CLI state
        uses: actions/cache@v4
        with:
          path: |
            ~/.supabase
            supabase/.temp
          key: supabase-cli-state-${{ runner.os }}-${{ hashFiles('supabase/config.toml', 'supabase/migrations/**/*.sql') }}
          restore-keys: |
            supabase-cli-state-${{ runner.os }}-

      - name: Start local Supabase stack
        run: supabase start -x studio,inbucket,imgproxy,edge-runtime,logflare,vector,pgadmin-schema-diff,migra

      - name: Save Docker images to cache
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache
          IMAGES=$(docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -Ei 'supabase|postgres|kong|gotrue|postgrest|realtime|storage' \
            | grep -v '<none>' || true)
          if [ -n "$IMAGES" ]; then
            echo "Saving images:"; echo "$IMAGES"
            docker save $IMAGES -o ~/.cache/supabase-docker-images.tar
            ls -lh ~/.cache/supabase-docker-images.tar
          else
            echo "No Supabase images found to cache."
          fi


      - name: Run db lint (JSON, fail on error-level)
        id: dblint
        run: |
          set -o pipefail
          # JSON output so we can emit precise GitHub annotations per finding.
          supabase db lint --level error --linked=false --output json | tee lint.json
          # Surface human-readable form too, useful when reading raw logs.
          supabase db lint --level error --linked=false || true

      - name: Annotate findings
        if: always() && hashFiles('lint.json') != ''
        run: |
          # supabase db lint JSON shape (per schema):
          # [ { "level": "...",
          #     "lints": [ { "name", "level", "message", "detail", "function",
          #                   "statement_position", "cache_key" }, ... ] }, ... ]
          # Annotations need a file path. lint findings reference database
          # objects, not files, so we best-effort map an object name back to
          # the migration that last defines it via grep.
          if ! command -v jq >/dev/null; then sudo apt-get update -y && sudo apt-get install -y jq; fi

          ERRORS=0
          # Flatten: one line per finding => "level<TAB>name<TAB>function<TAB>message"
          jq -r '
            (if type=="array" then . else [.] end)
            | map(.lints // [])
            | add // []
            | .[]
            | [ (.level // "error"),
                (.name // ""),
                (.function // .relation // .object // ""),
                ((.message // "") + (if .detail then " — " + .detail else "" end))
              ] | @tsv
          ' lint.json > findings.tsv || true

          while IFS=$'\t' read -r level name fn msg; do
            [ -z "$level" ] && continue
            # Map gh annotation level
            case "$level" in
              error)   gh_lvl="error" ;;
              warning) gh_lvl="warning" ;;
              *)       gh_lvl="notice" ;;
            esac

            file=""; line=""
            if [ -n "$fn" ]; then
              # Find the migration that mentions this object (function / table / policy).
              match=$(grep -RInE "\b${fn}\b" supabase/migrations 2>/dev/null | head -n1 || true)
              if [ -n "$match" ]; then
                file=$(echo "$match" | cut -d: -f1)
                line=$(echo "$match" | cut -d: -f2)
              fi
            fi

            title="supabase db lint: ${name:-finding}${fn:+ ($fn)}"
            esc_msg=$(printf '%s' "$msg" | tr '\n' ' ' | sed 's/::/:\\:/g')

            if [ -n "$file" ] && [ -n "$line" ]; then
              echo "::${gh_lvl} file=${file},line=${line},title=${title}::${esc_msg}"
            else
              echo "::${gh_lvl} title=${title}::${esc_msg}"
            fi

            if [ "$level" = "error" ]; then ERRORS=$((ERRORS+1)); fi
          done < findings.tsv

          echo "error_count=$ERRORS" >> "$GITHUB_OUTPUT"
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::supabase db lint reported $ERRORS error-level finding(s)"
            exit 1
          fi


      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup || true
