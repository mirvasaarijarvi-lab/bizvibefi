version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Helsinki"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    ignore:
      # Lovable platform packages are managed by the Lovable build system and
      # publish frequently; the Dependabot release-age cooldown cannot resolve
      # their latest versions, which fails every other update in the run.
      - dependency-name: "@lovable.dev/*"
      # TypeScript 7 is not supported by typescript-eslint yet; the update job
      # cannot resolve the peer range and fails the whole run. Re-enable once
      # typescript-eslint ships TypeScript 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # React must move in lockstep with react-dom and its types. Dependabot
      # bumps them separately, leaving react 19 with react-dom 18, which
      # crashes every component test. Upgrade React majors manually.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"


  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Helsinki"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
